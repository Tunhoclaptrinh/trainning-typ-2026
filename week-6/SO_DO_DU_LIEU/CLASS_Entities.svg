<text x="55" y="754" font-family="Arial" font-size="14" fill="#1e293b">+ tokenHash: string</text>
<text x="55" y="777" font-family="Arial" font-size="14" fill="#1e293b">+ expiresAt: Date</text>
<text x="55" y="800" font-family="Arial" font-size="14" fill="#1e293b">+ user: AuthorEntity</text>
<rect x="930" y="600" width="390" height="280" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
<rect x="930" y="600" width="390" height="58" rx="8" fill="#0f766e"/>
<text x="944" y="623" font-family="Arial" font-weight="bold" font-size="17" fill="white">AdminAuditLogEntity</text>
<text x="944" y="645" font-family="Arial" font-size="13" fill="#ccfbf1">@Entity("admin_audit_logs")</text>
<text x="945" y="685" font-family="Arial" font-size="14" fill="#1e293b">+ id: string</text>
<text x="945" y="708" font-family="Arial" font-size="14" fill="#1e293b">+ actorId: string</text>
<text x="945" y="731" font-family="Arial" font-size="14" fill="#1e293b">+ action: string</text>
<text x="945" y="754" font-family="Arial" font-size="14" fill="#1e293b">+ targetType: string</text>
<text x="945" y="777" font-family="Arial" font-size="14" fill="#1e293b">+ metadata: Record</text>
<text x="945" y="800" font-family="Arial" font-size="14" fill="#1e293b">+ createdAt: Date</text>
<text x="40" y="950" font-family="Arial" font-size="15" fill="#475569">Workspace và notification được truy cập bằng SQL/service; không tự thêm class TypeORM không tồn tại.</text>
</svg>