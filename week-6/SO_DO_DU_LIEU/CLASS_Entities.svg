<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1010" viewBox="0 0 1360 1010">
<rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="40" y="48" font-family="Arial" font-size="25" font-weight="bold" fill="#172554">Class diagram — TypeORM persistence entities</text>
<text x="40" y="78" font-family="Arial" font-size="15" fill="#475569">Các class thật trong code; thuộc tính rút gọn. Quan hệ actorId của AdminAuditLogEntity là FK SQL, không có ORM decorator.</text>
<path d="M430,300 L485,300" fill="none" stroke="#475569" stroke-width="2"/>
<text x="441.5" y="292.0" font-family="Arial" font-size="13" fill="#334155">1 : N</text>
<path d="M875,300 L930,300" fill="none" stroke="#475569" stroke-width="2"/>
<text x="886.5" y="292.0" font-family="Arial" font-size="13" fill="#334155">N : 1</text>
<path d="M240,460 L240,600" fill="none" stroke="#475569" stroke-width="2"/>
<text x="224.0" y="522.0" font-family="Arial" font-size="13" fill="#334155">1 : N</text>
<rect x="40" y="180" width="390" height="280" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
<rect x="40" y="180" width="390" height="58" rx="8" fill="#0f766e"/>
<text x="54" y="203" font-family="Arial" font-weight="bold" font-size="17" fill="white">AuthorEntity</text>
<text x="54" y="225" font-family="Arial" font-size="13" fill="#ccfbf1">@Entity("users")</text>
<text x="55" y="265" font-family="Arial" font-size="14" fill="#1e293b">+ id: string</text>
<text x="55" y="288" font-family="Arial" font-size="14" fill="#1e293b">+ email: string</text>
<text x="55" y="311" font-family="Arial" font-size="14" fill="#1e293b">+ role: Role</text>
<text x="55" y="334" font-family="Arial" font-size="14" fill="#1e293b">+ isActive: boolean</text>
<text x="55" y="357" font-family="Arial" font-size="14" fill="#1e293b">+ passwordHash: string</text>
<text x="55" y="380" font-family="Arial" font-size="14" fill="#1e293b">+ templates: TemplateEntity[]</text>
<rect x="485" y="180" width="390" height="280" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
<rect x="485" y="180" width="390" height="58" rx="8" fill="#0f766e"/>
<text x="499" y="203" font-family="Arial" font-weight="bold" font-size="17" fill="white">TemplateEntity</text>
<text x="499" y="225" font-family="Arial" font-size="13" fill="#ccfbf1">@Entity("templates")</text>
<text x="500" y="265" font-family="Arial" font-size="14" fill="#1e293b">+ id: string</text>
<text x="500" y="288" font-family="Arial" font-size="14" fill="#1e293b">+ authorId: string</text>
<text x="500" y="311" font-family="Arial" font-size="14" fill="#1e293b">+ categoryId: string</text>
<text x="500" y="334" font-family="Arial" font-size="14" fill="#1e293b">+ title: string</text>
<text x="500" y="357" font-family="Arial" font-size="14" fill="#1e293b">+ contentJson: Record</text>
<text x="500" y="380" font-family="Arial" font-size="14" fill="#1e293b">+ revision: number</text>
<text x="500" y="403" font-family="Arial" font-size="14" fill="#1e293b">+ author: AuthorEntity</text>
<text x="500" y="426" font-family="Arial" font-size="14" fill="#1e293b">+ category: CategoryEntity</text>
<rect x="930" y="180" width="390" height="280" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
<rect x="930" y="180" width="390" height="58" rx="8" fill="#0f766e"/>
<text x="944" y="203" font-family="Arial" font-weight="bold" font-size="17" fill="white">CategoryEntity</text>
<text x="944" y="225" font-family="Arial" font-size="13" fill="#ccfbf1">@Entity("categories")</text>
<text x="945" y="265" font-family="Arial" font-size="14" fill="#1e293b">+ id: string</text>
<text x="945" y="288" font-family="Arial" font-size="14" fill="#1e293b">+ name: string</text>
<text x="945" y="311" font-family="Arial" font-size="14" fill="#1e293b">+ slug: string</text>
<text x="945" y="334" font-family="Arial" font-size="14" fill="#1e293b">+ templates: TemplateEntity[]</text>
<rect x="40" y="600" width="390" height="280" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
<rect x="40" y="600" width="390" height="58" rx="8" fill="#0f766e"/>
<text x="54" y="623" font-family="Arial" font-weight="bold" font-size="17" fill="white">RefreshSessionEntity</text>
<text x="54" y="645" font-family="Arial" font-size="13" fill="#ccfbf1">@Entity("auth_refresh_sessions")</text>
<text x="55" y="685" font-family="Arial" font-size="14" fill="#1e293b">+ id: string</text>
